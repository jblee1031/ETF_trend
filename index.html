<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETF Trend Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e39;
    --text: #e6e8ee;
    --muted: #9aa1b1;
    --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 24px 8px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0 0 4px; font-size: 22px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  main { padding: 20px; max-width: 1200px; margin: 0 auto; }
  section.group {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px 20px;
  }
  .group-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .group-head h2 { margin: 0; font-size: 17px; }
  .group-head .count { color: var(--muted); font-size: 12px; }
  .controls { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .controls button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 10px;
    font-size: 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  .controls button.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .chart-wrap { position: relative; height: 320px; margin-bottom: 14px; }
  .table-wrap {
    max-height: 320px;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  table { border-collapse: collapse; width: 100%; font-size: 12px; white-space: nowrap; }
  thead th {
    position: sticky; top: 0;
    background: #1e222c;
    color: var(--text);
    text-align: right;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    z-index: 1;
  }
  thead th:first-child { text-align: left; position: sticky; left: 0; z-index: 2; }
  tbody td {
    padding: 5px 10px;
    text-align: right;
    border-bottom: 1px solid #1e222c;
    color: var(--text);
  }
  tbody td:first-child {
    text-align: left;
    color: var(--muted);
    position: sticky; left: 0;
    background: var(--panel);
  }
  tbody tr:hover td { background: #1c2029; }
  tbody tr:hover td:first-child { background: #1c2029; }
  .up { color: #ff5f5f; }
  .down { color: #4f8cff; }
  .loading, .error { padding: 40px; text-align: center; color: var(--muted); }
  .tabs { display: flex; gap: 8px; padding: 0 20px; margin-top: 14px; }
  .tabs button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
  }
  .tabs button.active { background: var(--panel); color: var(--text); border-bottom-color: var(--panel); }
  .tab-panel { display: none; }
  .tab-panel.active { display: flex; flex-direction: column; gap: 28px; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
  }
  .toolbar label { font-size: 13px; color: var(--muted); }
  .toolbar select {
    background: #1e222c;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 13px;
  }
  .toolbar .note { font-size: 12px; color: var(--muted); margin-left: auto; }
  .toolbar .sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 4px; }
  .toolbar .controls { margin-bottom: 0; }
  tbody tr.sector-row td {
    background: #1a1e27;
    color: var(--text);
    font-weight: 600;
    font-size: 11px;
    text-align: left;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
  }
  tbody tr.sector-row:hover td { background: #1a1e27; }
  .rule {
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
    margin-left: 8px;
    font-family: ui-monospace, Consolas, monospace;
  }
  .dropped {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 12px;
    margin-bottom: 10px;
    padding: 8px 12px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    font-size: 12px;
  }
  .dropped .label { color: #ff9a9a; font-weight: 600; }
  .dropped a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--border); }
  .dropped a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .dropped .held { color: #6b7285; margin-left: 3px; }
  tbody td.sector { text-align: left; color: var(--muted); }
  .formula {
    background: #12151c;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 12px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12px;
    line-height: 1.7;
    color: var(--text);
    overflow-x: auto;
  }
  .formula .lead { color: var(--muted); font-family: inherit; }
  .formula .term { color: #7ee2a8; }
  .mv-cards { display: flex; flex-direction: column; gap: 10px; }
  .mv-card {
    display: flex;
    gap: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .mv-rank {
    flex: 0 0 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mv-body { flex: 1; min-width: 0; }
  .mv-name { font-size: 14px; font-weight: 600; }
  .mv-name a { color: var(--text); text-decoration: none; border-bottom: 1px dotted var(--muted); }
  .mv-name a:hover { color: var(--accent); }
  .mv-meta { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 6px; }
  .mv-score { font-size: 12px; color: #ffb03a; margin-top: 3px; font-family: ui-monospace, Consolas, monospace; }
  .mv-terms { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .mv-checks {
    list-style: none;
    margin: 8px 0 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
    font-size: 11px;
    color: var(--muted);
  }
  .mv-checks li::before { content: "✓ "; color: #7ee2a8; }
  .mv-checks li.miss { color: #6b7285; }
  .mv-checks li.miss::before { content: "✕ "; color: #ff7a7a; }
  .summary-lead {
    font-size: 14px;
    line-height: 1.7;
    padding: 12px 14px;
    margin-bottom: 12px;
    border-left: 3px solid var(--accent);
    background: #12151c;
    border-radius: 0 8px 8px 0;
  }
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 10px;
    margin-bottom: 10px;
  }
  .summary-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    min-width: 0;
  }
  .summary-card h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .summary-card .sub { font-size: 11px; color: #6b7285; margin-top: 6px; }
  .mini { width: 100%; border-collapse: collapse; font-size: 12px; white-space: normal; }
  .mini th, .mini td {
    position: static;
    background: none;
    padding: 4px 6px;
    border-bottom: 1px solid #1e222c;
    text-align: right;
    color: var(--text);
  }
  .mini th { color: var(--muted); font-weight: 500; }
  .mini th:first-child, .mini td:first-child { text-align: left; color: var(--muted); }
  .mini tr:hover td { background: none; }
  .mini td.up { color: #ff5f5f; }
  .mini td.down { color: #4f8cff; }
  .mini td a { color: var(--text); }
  .summary-list { margin: 0; padding-left: 18px; font-size: 12px; line-height: 1.8; }
  .summary-list .hold { color: #6b7285; }
  .summary-note { font-size: 11px; color: #6b7285; margin: 8px 0 0; }
  .sector-head {
    margin: 14px 0 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  tbody td a { color: var(--text); text-decoration: none; border-bottom: 1px dotted var(--muted); }
  tbody td a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .badge {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 5px;
    font-size: 10px;
    border-radius: 4px;
    background: #2d4a33;
    color: #7ee2a8;
  }
  .badge.new { background: #4a3a2d; color: #ffc07a; }
  .empty { padding: 28px; text-align: center; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>ETF Trend Dashboard</h1>
  <p id="updated-at">불러오는 중...</p>
</header>
<nav class="tabs">
  <button id="tab-btn-kr" class="active" data-tab="kr">국내 ETF</button>
  <button id="tab-btn-us" data-tab="us">미국 주식/ETF</button>
  <button id="tab-btn-kospi" data-tab="kospi">코스피200 정배열</button>
  <button id="tab-btn-kosdaq" data-tab="kosdaq">코스닥150 정배열</button>
</nav>
<main>
  <div id="app-kr" class="tab-panel active"><div class="loading">데이터를 불러오는 중입니다...</div></div>
  <div id="app-us" class="tab-panel"><div class="loading">데이터를 불러오는 중입니다...</div></div>
  <div id="app-kospi" class="tab-panel"><div class="loading">데이터를 불러오는 중입니다...</div></div>
  <div id="app-kosdaq" class="tab-panel"><div class="loading">데이터를 불러오는 중입니다...</div></div>
</main>

<script>
const PERIODS = [
  { key: "1m", label: "1개월", days: 22 },
  { key: "3m", label: "3개월", days: 65 },
  { key: "all", label: "전체", days: null },
];

const PALETTE = [
  "#4f8cff", "#ff5f5f", "#39d98a", "#ffb03a", "#c07dff",
  "#3adfe0", "#ff7dc0", "#a3d13a", "#ff9a4f", "#7d9bff",
  "#e0c93a", "#5fd0ff", "#ff5fa3", "#8aff8a", "#d1a3ff",
  "#ffd15f", "#5fffd1",
];

function colorFor(i) { return PALETTE[i % PALETTE.length]; }

function fmtNum(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return "";
  return n.toLocaleString("ko-KR", { maximumFractionDigits: 2 });
}

async function loadData(groupsUrl, pricesUrl) {
  const [groups, prices] = await Promise.all([
    fetch(groupsUrl, { cache: "no-store" }).then((r) => r.json()),
    fetch(pricesUrl, { cache: "no-store" }).then((r) => r.json()),
  ]);
  return { groups, prices };
}

function buildUnionDates(tickers, prices) {
  const set = new Set();
  tickers.forEach((t) => {
    const hist = prices.tickers[t.code]?.history || [];
    hist.forEach((p) => set.add(p.date));
  });
  return Array.from(set).sort();
}

function sliceDates(dates, days) {
  if (!days) return dates;
  return dates.slice(Math.max(0, dates.length - days));
}

function renderGroup(group, prices, currencySuffix) {
  const tickers = group.tickers;
  const allDates = buildUnionDates(tickers, prices);

  const section = document.createElement("section");
  section.className = "group";

  const head = document.createElement("div");
  head.className = "group-head";
  head.innerHTML = `<h2>${group.name}</h2><span class="count">${tickers.length}개 종목</span>`;
  section.appendChild(head);

  const controls = document.createElement("div");
  controls.className = "controls";

  const periodBtns = {};
  const metricBtns = {};

  PERIODS.forEach((p) => {
    const b = document.createElement("button");
    b.textContent = p.label;
    b.dataset.period = p.key;
    controls.appendChild(b);
    periodBtns[p.key] = b;
  });

  const sep = document.createElement("span");
  sep.style.width = "8px";
  controls.appendChild(sep);

  [["pct", "변동률(%)"], ["price", `종가(${currencySuffix})`]].forEach(([key, label]) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.dataset.metric = key;
    controls.appendChild(b);
    metricBtns[key] = b;
  });

  section.appendChild(controls);

  const chartWrap = document.createElement("div");
  chartWrap.className = "chart-wrap";
  const canvas = document.createElement("canvas");
  chartWrap.appendChild(canvas);
  section.appendChild(chartWrap);

  const tableWrap = document.createElement("div");
  tableWrap.className = "table-wrap";
  section.appendChild(tableWrap);

  const state = { period: "3m", metric: "pct" };

  function computeDatasets(dates) {
    return tickers.map((t, i) => {
      const hist = prices.tickers[t.code]?.history || [];
      const byDate = new Map(hist.map((p) => [p.date, p.close]));
      let base = null;
      const values = dates.map((d) => {
        const v = byDate.has(d) ? byDate.get(d) : null;
        if (v !== null && base === null) base = v;
        if (state.metric === "pct") {
          return v !== null && base ? (v / base) * 100 : null;
        }
        return v;
      });
      return {
        label: t.name,
        data: values,
        borderColor: colorFor(i),
        backgroundColor: colorFor(i),
        borderWidth: 1.5,
        pointRadius: 0,
        spanGaps: true,
        tension: 0.15,
      };
    });
  }

  let chart = null;
  function drawChart() {
    const periodDef = PERIODS.find((p) => p.key === state.period);
    const dates = sliceDates(allDates, periodDef.days);
    const datasets = computeDatasets(dates);

    Object.values(periodBtns).forEach((b) => b.classList.toggle("active", b.dataset.period === state.period));
    Object.values(metricBtns).forEach((b) => b.classList.toggle("active", b.dataset.metric === state.metric));

    if (chart) chart.destroy();
    chart = new Chart(canvas, {
      type: "line",
      data: { labels: dates, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: {
            position: "bottom",
            labels: { color: "#9aa1b1", boxWidth: 12, font: { size: 11 } },
          },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const v = ctx.parsed.y;
                const suffix = state.metric === "pct" ? "" : currencySuffix;
                return `${ctx.dataset.label}: ${fmtNum(v)}${suffix}`;
              },
            },
          },
        },
        scales: {
          x: { ticks: { color: "#9aa1b1", maxRotation: 0, autoSkip: true, maxTicksLimit: 10 }, grid: { color: "#1e222c" } },
          y: { ticks: { color: "#9aa1b1" }, grid: { color: "#1e222c" } },
        },
      },
    });
  }

  function drawTable() {
    const rows = [...allDates].reverse();
    let html = "<table><thead><tr><th>날짜</th>";
    tickers.forEach((t) => (html += `<th>${t.name}</th>`));
    html += "</tr></thead><tbody>";

    const histMaps = tickers.map((t) => new Map((prices.tickers[t.code]?.history || []).map((p) => [p.date, p.close])));

    rows.forEach((d, rowIdx) => {
      html += `<tr><td>${d}</td>`;
      histMaps.forEach((m) => {
        const v = m.has(d) ? m.get(d) : null;
        html += `<td>${v === null ? "-" : fmtNum(v)}</td>`;
      });
      html += "</tr>";
    });
    html += "</tbody></table>";
    tableWrap.innerHTML = html;
  }

  Object.entries(periodBtns).forEach(([key, btn]) => {
    btn.addEventListener("click", () => {
      state.period = key;
      drawChart();
    });
  });
  Object.entries(metricBtns).forEach(([key, btn]) => {
    btn.addEventListener("click", () => {
      state.metric = key;
      drawChart();
    });
  });

  drawChart();
  drawTable();

  return section;
}

async function loadMarket(containerId, groupsUrl, pricesUrl, currencySuffix) {
  const app = document.getElementById(containerId);
  try {
    const { groups, prices } = await loadData(groupsUrl, pricesUrl);
    app.innerHTML = "";
    groups.forEach((g) => app.appendChild(renderGroup(g, prices, currencySuffix)));
    return prices.generated_at;
  } catch (err) {
    console.error(err);
    app.innerHTML = `<div class="error">데이터를 불러오지 못했습니다: ${err.message}</div>`;
    return null;
  }
}

// ---- 정배열 탭 (코스피200 / 코스닥150 공용) ----

const MA_LABELS = ["MA5", "MA10", "MA20", "MA60", "MA120"];
const CHART_MAX_LINES = 20;
const PARETO_MODES = [
  { key: "short", label: "단기 정배열" },
  { key: "full", label: "완전 정배열" },
];

function fnguideUrl(code) {
  return `https://wcomp.fnguide.com/?cmp_cd=${encodeURIComponent(code)}`;
}

// 시가총액은 억원 단위로 들어온다.
function fmtCap(cap) {
  if (cap === null || cap === undefined) return "-";
  if (cap >= 10000) return `${(cap / 10000).toFixed(1)}조`;
  return `${fmtNum(cap)}억`;
}

function stockCell(code, data, extra) {
  return (
    `<td><a href="${fnguideUrl(code)}" target="_blank" rel="noopener">${data.names[code] || code}</a>${extra || ""}</td>` +
    `<td class="sector">${data.sectors[code] || "-"}</td>` +
    `<td>${fmtCap(data.caps[code])}</td>`
  );
}

const TABLE_COLS = 4 + MA_LABELS.length;

function sortRows(rows, data, sort) {
  const copy = [...rows];
  if (sort === "cap") {
    copy.sort((a, b) => (data.caps[b.c] || 0) - (data.caps[a.c] || 0));
  } else {
    copy.sort((a, b) => b.f - a.f || b.s - a.s || a.c.localeCompare(b.c));
  }
  return copy;
}

function bySector(rows, data, sort) {
  const groups = new Map();
  rows.forEach((r) => {
    const sector = data.sectors[r.c] || "기타";
    if (!groups.has(sector)) groups.set(sector, []);
    groups.get(sector).push(r);
  });
  const capOf = (list) => list.reduce((sum, r) => sum + (data.caps[r.c] || 0), 0);
  return [...groups.entries()]
    .map(([sector, list]) => ({ sector, rows: sortRows(list, data, sort) }))
    .sort((a, b) =>
      sort === "cap"
        ? capOf(b.rows) - capOf(a.rows)
        : b.rows.length - a.rows.length || a.sector.localeCompare(b.sector)
    );
}

function signalRow(r, data, withFullBadge) {
  const badge = withFullBadge && r.f ? `<span class="badge">완전정배열</span>` : "";
  const fresh = r.s === 1 ? `<span class="badge new">신규</span>` : "";
  const chgCls = r.r > 0 ? "up" : r.r < 0 ? "down" : "";
  let html = `<tr>${stockCell(r.c, data, badge + fresh)}`;
  html += `<td>${fmtNum(r.p)}</td>`;
  html += `<td class="${chgCls}">${r.r === null ? "-" : (r.r > 0 ? "+" : "") + r.r.toFixed(2) + "%"}</td>`;
  r.m.forEach((v) => (html += `<td>${v === null ? "-" : fmtNum(v)}</td>`));
  return html + `<td>${withFullBadge ? r.s : r.f}</td></tr>`;
}

function signalTable(rows, data, withFullBadge, opts) {
  if (!rows.length) return `<div class="empty">해당 조건을 만족하는 종목이 없습니다.</div>`;
  const { sort = "streak", group = false } = opts || {};

  let html = "<table><thead><tr><th>종목</th><th>섹터</th><th>시가총액</th><th>종가</th><th>등락률</th>";
  MA_LABELS.forEach((m) => (html += `<th>${m}</th>`));
  html += "<th>연속일</th></tr></thead><tbody>";

  if (group) {
    bySector(rows, data, sort).forEach((g) => {
      const cap = g.rows.reduce((sum, r) => sum + (data.caps[r.c] || 0), 0);
      html += `<tr class="sector-row"><td colspan="${TABLE_COLS}">${g.sector} · ${g.rows.length}종목 · ${fmtCap(cap)}</td></tr>`;
      g.rows.forEach((r) => (html += signalRow(r, data, withFullBadge)));
    });
  } else {
    sortRows(rows, data, sort).forEach((r) => (html += signalRow(r, data, withFullBadge)));
  }
  return html + "</tbody></table>";
}

function droppedStrip(prevRows, currRows, data, fullOnly) {
  if (!prevRows) return "";
  const streakOf = (r) => (fullOnly ? r.f : r.s);
  const qualifies = (r) => (fullOnly ? r.f > 0 : true);

  const stillIn = new Set(currRows.filter(qualifies).map((r) => r.c));
  const gone = prevRows.filter((r) => qualifies(r) && !stillIn.has(r.c));
  if (!gone.length) return "";

  const items = gone
    .sort((a, b) => streakOf(b) - streakOf(a))
    .map(
      (r) =>
        `<span><a href="${fnguideUrl(r.c)}" target="_blank" rel="noopener">${data.names[r.c] || r.c}</a>` +
        `<span class="held">${streakOf(r)}일 유지</span></span>`
    )
    .join("");
  return `<div class="dropped"><span class="label">전일 대비 편출 ${gone.length}종목</span>${items}</div>`;
}

function trendChart(canvas, data, codes, period, metric, asOfDate) {
  const cut = data.chart_dates.indexOf(asOfDate);
  const end = cut === -1 ? data.chart_dates.length : cut + 1;
  const periodDef = PERIODS.find((p) => p.key === period);
  const dates = sliceDates(data.chart_dates.slice(0, end), periodDef.days);
  const start = end - dates.length;

  const datasets = codes.map((code, i) => {
    const window = (data.series[code] || []).slice(start, end);
    let base = null;
    const values = window.map((v) => {
      if (v !== null && v !== undefined && base === null) base = v;
      if (v === null || v === undefined) return null;
      return metric === "pct" ? (v / base) * 100 : v;
    });
    return {
      label: data.names[code] || code,
      data: values,
      borderColor: colorFor(i),
      backgroundColor: colorFor(i),
      borderWidth: 1.5,
      pointRadius: 0,
      spanGaps: true,
      tension: 0.15,
    };
  });

  return new Chart(canvas, {
    type: "line",
    data: { labels: dates, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { position: "bottom", labels: { color: "#9aa1b1", boxWidth: 12, font: { size: 11 } } },
        tooltip: {
          callbacks: {
            label: (ctx) => `${ctx.dataset.label}: ${fmtNum(ctx.parsed.y)}${metric === "pct" ? "" : "원"}`,
          },
        },
      },
      scales: {
        x: { ticks: { color: "#9aa1b1", maxRotation: 0, autoSkip: true, maxTicksLimit: 10 }, grid: { color: "#1e222c" } },
        y: { ticks: { color: "#9aa1b1" }, grid: { color: "#1e222c" } },
      },
    },
  });
}

function paretoChart(canvas, buckets, onPick) {
  const total = buckets.reduce((sum, b) => sum + b.codes.length, 0);
  let running = 0;
  const cumulative = buckets.map((b) => {
    running += b.codes.length;
    return (running / total) * 100;
  });

  return new Chart(canvas, {
    type: "bar",
    data: {
      labels: buckets.map((b) => b.sector),
      datasets: [
        {
          type: "bar",
          label: "종목 수",
          data: buckets.map((b) => b.codes.length),
          backgroundColor: "#4f8cff",
          hoverBackgroundColor: "#7aa8ff",
          yAxisID: "y",
          order: 2,
        },
        {
          type: "line",
          label: "누적 비중(%)",
          data: cumulative,
          borderColor: "#ffb03a",
          backgroundColor: "#ffb03a",
          borderWidth: 1.5,
          pointRadius: 2,
          yAxisID: "y1",
          order: 1,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      onClick: (_evt, elements) => {
        if (elements.length) onPick(buckets[elements[0].index]);
      },
      onHover: (_evt, elements, chart) => {
        chart.canvas.style.cursor = elements.length ? "pointer" : "default";
      },
      plugins: {
        legend: { position: "bottom", labels: { color: "#9aa1b1", boxWidth: 12, font: { size: 11 } } },
        tooltip: {
          callbacks: {
            label: (ctx) =>
              ctx.dataset.type === "bar"
                ? `종목 수: ${ctx.parsed.y}`
                : `누적 비중: ${ctx.parsed.y.toFixed(1)}%`,
          },
        },
      },
      scales: {
        x: { type: "category", ticks: { color: "#9aa1b1", maxRotation: 60, minRotation: 45, font: { size: 10 } }, grid: { display: false } },
        y: { beginAtZero: true, ticks: { color: "#9aa1b1", precision: 0 }, grid: { color: "#1e222c" }, title: { display: true, text: "종목 수", color: "#9aa1b1" } },
        y1: {
          position: "right",
          beginAtZero: true,
          max: 100,
          ticks: { color: "#ffb03a", callback: (v) => v + "%" },
          grid: { drawOnChartArea: false },
        },
      },
    },
  });
}

// 마크 미네르비니 추세 템플릿(Trend Template)의 8개 조건. 순서는 원문 그대로.
const MV_CRITERIA = [
  "종가 > 150일선, 200일선",
  "150일선 > 200일선",
  "200일선 1개월 상승",
  "50일선 > 150일선, 200일선",
  "종가 > 50일선",
  "52주 저점 대비 +30% 이상",
  "52주 고점 대비 -25% 이내",
  "RS ≥ 70",
];

// 8개 조건을 모두 통과한 종목끼리 줄을 세우기 위한 점수. 각 항을 0~100으로
// 맞춘 뒤 가중합한다: 상대강도에 가장 큰 비중을, 신고가 근접도에 그다음을 둔다.
function mvScore(t) {
  const rs = t.rs ?? 0;
  const nearHigh = 100 - t.hi;
  const offLow = Math.min(t.lo, 200) / 2;
  const slope = Math.min(Math.max(t.sl, 0), 10) * 10;
  return 0.4 * rs + 0.3 * nearHigh + 0.15 * offLow + 0.15 * slope;
}

function mvCard(row, data, rank) {
  const t = row.t;
  const checks = MV_CRITERIA.map(
    (label, i) => `<li class="${t.k[i] ? "" : "miss"}">${label}</li>`
  ).join("");
  return `
    <div class="mv-card">
      <div class="mv-rank">${rank}</div>
      <div class="mv-body">
        <div class="mv-name">
          <a href="${fnguideUrl(row.c)}" target="_blank" rel="noopener">${data.names[row.c] || row.c}</a>
          <span class="mv-meta">${data.sectors[row.c] || "-"} · ${fmtCap(data.caps[row.c])} · ${fmtNum(row.p)}원</span>
        </div>
        <div class="mv-score">Score ${mvScore(t).toFixed(1)}</div>
        <div class="mv-terms">RS ${t.rs} · 고점이격 ${t.hi.toFixed(1)}% · 저점대비 +${t.lo.toFixed(1)}% · 200일선 기울기 ${t.sl > 0 ? "+" : ""}${t.sl.toFixed(2)}%</div>
        <ul class="mv-checks">${checks}</ul>
      </div>
    </div>`;
}

function renderMinervini(box, countEl, rows, data) {
  const scored = rows.filter((r) => r.t && r.t.n === 8);
  countEl.textContent = `8개 조건 통과 ${scored.length}종목`;
  if (!scored.length) {
    box.innerHTML = `<div class="empty">8개 조건을 모두 통과한 종목이 없습니다.</div>`;
    return;
  }
  const ranked = [...scored].sort((a, b) => mvScore(b.t) - mvScore(a.t));
  box.innerHTML = ranked.map((r, i) => mvCard(r, data, i + 1)).join("");
}

// ---- 5. 시장 요약 ----

function signedPct(v, digits = 2) {
  if (v === null || v === undefined || Number.isNaN(v)) return "-";
  return `${v > 0 ? "+" : ""}${v.toFixed(digits)}%`;
}

function pctCell(v) {
  const cls = v > 0 ? "up" : v < 0 ? "down" : "";
  return `<td class="${cls}">${signedPct(v)}</td>`;
}

function stockLink(code, data) {
  return `<a href="${fnguideUrl(code)}" target="_blank" rel="noopener">${data.names[code] || code}</a>`;
}

function indexStats(index, date) {
  if (!index || !index.dates.length) return null;
  let i = index.dates.indexOf(date);
  if (i === -1) i = index.dates.filter((d) => d <= date).length - 1;
  if (i < 1) return null;
  const c = index.closes;
  const back = (n) => (i - n >= 0 ? (c[i] / c[i - n] - 1) * 100 : null);
  const ma = (w) => (i + 1 >= w ? c.slice(i + 1 - w, i + 1).reduce((a, b) => a + b, 0) / w : null);
  const from = Math.max(1, i - 59);
  const hi = Math.max(...c.slice(from - 1, i + 1));
  let bigMoves = 0;
  for (let k = from; k <= i; k++) if (Math.abs(c[k] / c[k - 1] - 1) >= 0.06) bigMoves++;
  const above = [];
  const below = [];
  [5, 20, 60, 120].forEach((w) => {
    const m = ma(w);
    if (m === null) return;
    (c[i] >= m ? above : below).push(w);
  });
  return { close: c[i], chg: back(1), d5: back(5), d20: back(20), fromHi: (c[i] / hi - 1) * 100, above, below, bigMoves };
}

function maPosition(st) {
  const join = (ws) => ws.join("·") + "일선";
  if (!st.above.length) return "모든 이평선 아래";
  if (!st.below.length) return "모든 이평선 위";
  return `${join(st.above)} 위 / ${join(st.below)} 아래`;
}

function summarize(data, date) {
  const at = data.dates.indexOf(date);
  const rows = data.snapshots[date] || [];
  const prevDate = at > 0 ? data.dates[at - 1] : null;
  const prevRows = prevDate ? data.snapshots[prevDate] : null;
  const market = data.market ? data.market[date] : null;
  const ix = indexStats(data.index, date);

  const counts = data.dates.slice(0, at + 1).map((d) => {
    const rs = data.snapshots[d];
    return { d, s: rs.length, f: rs.filter((r) => r.f).length, m: rs.filter((r) => r.t && r.t.n === 8).length };
  });
  const cur = counts[counts.length - 1];
  const prev = counts.length > 1 ? counts[counts.length - 2] : null;

  // consecutive same-direction moves in the short-alignment count, ending today
  let streak = 0;
  for (let k = counts.length - 1; k > 0; k--) {
    const step = Math.sign(counts[k].s - counts[k - 1].s);
    if (step === 0 || (streak !== 0 && step !== Math.sign(streak))) break;
    streak += step;
  }

  const byCode = new Map(rows.map((r) => [r.c, r]));
  const change = prevRows
    ? {
        newShort: rows.filter((r) => r.s === 1),
        outShort: prevRows.filter((r) => !byCode.has(r.c)).sort((a, b) => b.s - a.s),
        newFull: rows.filter((r) => r.f === 1),
        outFull: prevRows.filter((r) => r.f && !(byCode.get(r.c) || {}).f).sort((a, b) => b.f - a.f),
      }
    : null;

  const sectorCount = (d) => {
    const m = new Map();
    (data.snapshots[d] || []).forEach((r) => {
      const s = data.sectors[r.c] || "기타";
      m.set(s, (m.get(s) || 0) + 1);
    });
    return m;
  };
  const secToday = sectorCount(date);
  const secBefore = at >= 5 ? sectorCount(data.dates[at - 5]) : null;
  const topSector = [...secToday.entries()].sort((a, b) => b[1] - a[1])[0];

  // headline
  const lead = [];
  if (ix) lead.push(`<b>${data.index.label} ${signedPct(ix.chg)}</b>`);
  if (market) {
    const moved = market.adv + market.dec;
    const decShare = moved ? market.dec / moved : 0;
    const tone = decShare >= 0.65 ? "넓게 하락" : decShare <= 0.35 ? "넓게 상승" : "종목별로 엇갈림";
    lead.push(`구성종목은 <b>${tone}</b> (상승 ${market.adv} / 하락 ${market.dec}, 중간값 ${signedPct(market.median)})`);
  }
  let headline = lead.length ? lead.join(", ") + "." : "";
  if (ix && market && Math.abs(ix.chg) >= 0.3 && Math.abs(market.median) >= 0.3 && Math.sign(ix.chg) !== Math.sign(market.median)) {
    headline += " 지수와 종목 중간값의 방향이 달라, 대형주 몇 종목이 지수를 끌고 간 날입니다.";
  }
  if (prev) {
    const diff = cur.s - prev.s;
    let s = ` 단기 정배열 ${prev.s}→<b>${cur.s}</b>(${diff >= 0 ? "+" : ""}${diff})`;
    if (Math.abs(streak) >= 3) s += `, ${Math.abs(streak)}거래일 연속 ${streak > 0 ? "증가" : "감소"}`;
    s += `, 완전 정배열 ${prev.f}→<b>${cur.f}</b>.`;
    headline = (headline + s).trim();
  }

  // observations
  const notes = [];
  const recent = counts.slice(-10);
  const peakFull = recent.reduce((a, b) => (b.f > a.f ? b : a), recent[0]);
  if (peakFull && peakFull.f >= 4 && cur.f <= peakFull.f / 2 && peakFull.d !== date) {
    notes.push(`완전 정배열이 ${peakFull.d.slice(5)} ${peakFull.f}종목에서 ${cur.f}종목으로 절반 이하로 줄었습니다.`);
  }
  if (change) {
    const brokeBoth = change.outFull.filter((r) => !byCode.has(r.c));
    if (brokeBoth.length >= 2) {
      const who = brokeBoth.length === change.outFull.length
        ? `${brokeBoth.length}종목 모두`
        : `${change.outFull.length}종목 중 ${brokeBoth.length}종목은`;
      notes.push(`완전 정배열에서 빠진 ${who} 단기 정배열까지 한 번에 깨졌습니다.`);
    }
    const longExits = change.outShort.filter((r) => r.s >= 10);
    if (longExits.length) {
      notes.push(`10일 이상 정배열을 유지하던 ${longExits.length}종목이 편출됐습니다: ${longExits.slice(0, 5).map((r) => `${stockLink(r.c, data)}(${r.s}일)`).join(", ")}.`);
    }
  }
  if (topSector && rows.length >= 10 && topSector[1] / rows.length >= 0.3) {
    notes.push(`단기 정배열 ${rows.length}종목 중 ${Math.round((topSector[1] / rows.length) * 100)}%가 <b>${topSector[0]}</b> 한 섹터입니다. 이 섹터가 흔들리면 정배열 수가 한꺼번에 줄 수 있습니다.`);
  }
  if (market && secBefore) {
    const moveOf = new Map(market.sectors.map((s) => [s[0], s[2]]));
    [...secToday.entries()]
      .filter(([s, n]) => n > (secBefore.get(s) || 0) && (moveOf.get(s) ?? 0) <= -3)
      .forEach(([s, n]) => {
        notes.push(`<b>${s}</b> 섹터는 정배열 종목이 5거래일 전 ${secBefore.get(s) || 0}종목에서 ${n}종목으로 늘었는데, 오늘 섹터 등락이 ${signedPct(moveOf.get(s))}입니다.`);
      });
  }
  if (ix && ix.bigMoves >= 5) {
    notes.push(`최근 60거래일 중 지수가 하루 ±6% 넘게 움직인 날이 ${ix.bigMoves}일입니다. 5·10일선 기반 단기 정배열이 하루 만에 깨지기 쉬운 장입니다.`);
  }

  return { headline, ix, market, counts, change, secToday, secBefore, notes };
}

  const sm = summarize(data, date);
  const cards = [];

  if (sm.ix) {
    const ix = sm.ix;
    cards.push(`
      <div class="summary-card">
        <h3>지수 · ${data.index.label}</h3>

  const recent = sm.counts.slice(-6);

      <table class="mini">
        <tr><th>날짜</th><th>단기</th><th>완전</th><th>미네르비니</th></tr>
        ${recent.map((c) => `<tr><td>${c.d.slice(5)}</td><td>${c.s}</td><td>${c.f}</td><td>${c.m}</td></tr>`).join("")}
      </table>
      ${sm.market ? `<div class="sub">구성종목 상승 ${sm.market.adv} · 하락 ${sm.market.dec} · 보합 ${sm.market.flat} · 중간값 ${signedPct(sm.market.median)}</div>` : ""}
    </div>`);

  if (sm.market) {
    const secs = sm.market.sectors;

    const secRow = (s) => `<tr><td>${s[0]} <span class="hold">(${s[1]})</span></td>${pctCell(s[2])}</tr>`;
    cards.push(`
      <div class="summary-card">
        <h3>섹터 등락 (시가총액 가중)</h3>
        <table class="mini">
          <tr><th>강세</th><th></th></tr>${best.map(secRow).join("")}
          <tr><th>약세</th><th></th></tr>${worst.map(secRow).join("")}

      </div>`);

    const moverRow = ([c, v]) => `<tr><td>${stockLink(c, data)} <span class="hold">${data.sectors[c] || ""}</span></td>${pctCell(v)}</tr>`;
    cards.push(`
      <div class="summary-card">
        <h3>등락률 상위 · 하위</h3>
        <table class="mini">
          <tr><th>상승</th><th></th></tr>${sm.market.gainers.map(moverRow).join("")}
          <tr><th>하락</th><th></th></tr>${sm.market.losers.map(moverRow).join("")}
        </table>
      </div>`);
  }

  if (sm.change) {
    const names = (list, days) =>
      list.length
        ? list.map((r) => `${stockLink(r.c, data)}${days ? ` <span class="hold">${days(r)}일</span>` : ""}`).join(", ")
        : `<span class="hold">없음</span>`;
    cards.push(`
      <div class="summary-card">
        <h3>전일 대비 정배열 변화</h3>
        <ul class="summary-list">
          <li>단기 신규 ${sm.change.newShort.length}: ${names(sm.change.newShort)}</li>
          <li>단기 편출 ${sm.change.outShort.length}: ${names(sm.change.outShort, (r) => r.s)}</li>
          <li>완전 신규 ${sm.change.newFull.length}: ${names(sm.change.newFull)}</li>
          <li>완전 이탈 ${sm.change.outFull.length}: ${names(sm.change.outFull, (r) => r.f)}</li>
        </ul>
        <div class="sub">편출·이탈 옆 숫자는 빠지기 전까지 유지한 일수</div>
      </div>`);
  }

  box.innerHTML = `
    <div class="summary-lead">${sm.headline}</div>
    <div class="summary-grid">${cards.join("")}</div>
    ${sm.notes.length ? `<div class="summary-card"><h3>관찰 포인트</h3><ul class="summary-list">${sm.notes.map((n) => `<li>${n}</li>`).join("")}</ul></div>` : ""}
    <p class="summary-note">기준일 데이터로 자동 생성한 요약입니다. 섹터 등락은 최신 시가총액으로 가중했고 유동주식 비율은 반영하지 않았습니다. 매매 권유가 아닙니다.</p>`;
}

    </section>
    <section class="group">
      <div class="group-head">
        <h2>3. 섹터 분포 <span class="rule">막대를 클릭하면 해당 섹터 종목이 표시됩니다</span></h2>
        <span class="count pareto-count"></span>
      </div>
      <div class="controls pareto-controls"></div>
      <div class="chart-wrap"><canvas class="pareto-canvas"></canvas></div>
      <div class="sector-detail"></div>
    </section>
    <section class="group">
      <div class="group-head">
        <h2>4. 미네르비니 추세 템플릿 <span class="rule">단기 정배열 종목 중 8개 조건을 모두 통과한 종목 (점수순)</span></h2>
        <span class="count mv-count"></span>
      </div>
      <div class="formula">
        <span class="lead">8개 조건을 모두 통과한 종목만 후보로 두고, 아래 점수로 순위를 매깁니다.</span><br>
        Score = 0.40 × <span class="term">RS</span>
              + 0.30 × <span class="term">(100 − 고점이격%)</span>
              + 0.15 × <span class="term">min(저점이격%, 200) ÷ 2</span>
              + 0.15 × <span class="term">min(max(200일선 기울기%, 0), 10) × 10</span><br>
        <span class="lead">RS = 0.4·r(63일) + 0.2·r(126일) + 0.2·r(189일) + 0.2·r(252일) 의 유니버스 내 백분위 (0–99)</span><br>
        <span class="lead">고점이격 = 1 − 종가/52주 최고가 · 저점이격 = 종가/52주 최저가 − 1 · 기울기 = 200일선의 22거래일 변화율</span>
      </div>
      <div class="mv-cards"></div>
    </section>
    <section class="group">
      <div class="group-head">
        <h2>5. 시장 요약 <span class="rule">기준일 데이터로 자동 생성</span></h2>
      </div>
      <div class="market-summary"></div>
    </section>`;

  const q = (sel) => app.querySelector(sel);
  const state = {
    date: dates[0],
    period: "3m",
    metric: "pct",
    paretoMode: "short",
    sector: null,
    sort: "streak",
    group: false,
  };

  function makeButtons(container, items, onPick) {
    const btns = {};
    items.forEach(([key, text]) => {
      const b = document.createElement("button");
      b.textContent = text;
      container.appendChild(b);
      btns[key] = b;
      b.addEventListener("click", () => onPick(key));
    });
    return btns;
  }

  const trendControls = q(".trend-controls");
  const periodBtns = makeButtons(trendControls, PERIODS.map((p) => [p.key, p.label]), (k) => {
    state.period = k;
    drawTrend();
  });
  const sep = document.createElement("span");
  sep.style.width = "8px";
  trendControls.appendChild(sep);
  const metricBtns = makeButtons(trendControls, [["pct", "변동률(%)"], ["price", "종가(원)"]], (k) => {
    state.metric = k;
    drawTrend();
  });
  const sortBtns = makeButtons(
    q(".sort-controls"),
    [["streak", "연속일순"], ["cap", "시가총액순"]],
    (k) => {
      state.sort = k;
      drawTables();
    }
  );
  const groupBtn = makeButtons(q(".group-controls"), [["group", "섹터별 묶기"]], () => {
    state.group = !state.group;
    drawTables();
  }).group;

  const paretoBtns = makeButtons(
    q(".pareto-controls"),
    PARETO_MODES.map((m) => [m.key, m.label]),
    (k) => {
      state.paretoMode = k;
      state.sector = null;
      drawPareto();
    }
  );

  let trend = null;
  let pareto = null;

  function currentRows() {
    return data.snapshots[state.date] || [];
  }

  function drawTrend() {
    const fullRows = currentRows().filter((r) => r.f);
    Object.entries(periodBtns).forEach(([k, b]) => b.classList.toggle("active", k === state.period));
    Object.entries(metricBtns).forEach(([k, b]) => b.classList.toggle("active", k === state.metric));

    if (trend) { trend.destroy(); trend = null; }
    const codes = fullRows.slice(0, CHART_MAX_LINES).map((r) => r.c).filter((c) => data.series[c]);
    if (codes.length) trend = trendChart(q(".trend-canvas"), data, codes, state.period, state.metric, state.date);
  }

  function drawSectorDetail(bucket) {
    const box = q(".sector-detail");
    if (!bucket) { box.innerHTML = ""; return; }
    const rows = currentRows().filter((r) => bucket.codes.includes(r.c));
    box.innerHTML =
      `<div class="sector-head">${bucket.sector} · ${rows.length}종목</div>` +
      `<div class="table-wrap">${signalTable(rows, data, state.paretoMode === "short", { sort: state.sort })}</div>`;
  }

  function drawPareto() {
    const rows = currentRows().filter((r) => (state.paretoMode === "full" ? r.f : true));
    const bySector = new Map();
    rows.forEach((r) => {
      const sector = data.sectors[r.c] || "기타";
      if (!bySector.has(sector)) bySector.set(sector, []);
      bySector.get(sector).push(r.c);
    });
    const buckets = [...bySector.entries()]
      .map(([sector, codes]) => ({ sector, codes }))
      .sort((a, b) => b.codes.length - a.codes.length || a.sector.localeCompare(b.sector));

    Object.entries(paretoBtns).forEach(([k, b]) => b.classList.toggle("active", k === state.paretoMode));
    q(".pareto-count").textContent = `${buckets.length}개 섹터 / ${rows.length}종목`;

    if (pareto) { pareto.destroy(); pareto = null; }
    if (buckets.length) {
      pareto = paretoChart(q(".pareto-canvas"), buckets, (bucket) => {
        state.sector = bucket.sector;
        drawSectorDetail(bucket);
      });
    }
    drawSectorDetail(state.sector ? buckets.find((b) => b.sector === state.sector) : null);
  }

  function drawTables() {
    const rows = currentRows();
    const fullRows = rows.filter((r) => r.f);
    const opts = { sort: state.sort, group: state.group };

    Object.entries(sortBtns).forEach(([k, b]) => b.classList.toggle("active", k === state.sort));
    groupBtn.classList.toggle("active", state.group);

    q(".short-count").textContent = `${rows.length}종목`;
    q(".full-count").textContent = `${fullRows.length}종목`;
    q(".short-table").innerHTML = signalTable(rows, data, true, opts);
    q(".full-table").innerHTML = signalTable(fullRows, data, false, opts);
  }

  function draw() {
    const rows = currentRows();
    const prevDate = data.dates[data.dates.indexOf(state.date) - 1];
    const prevRows = prevDate ? data.snapshots[prevDate] : null;

    drawTables();
    q(".short-dropped").innerHTML = droppedStrip(prevRows, rows, data, false);
    q(".full-dropped").innerHTML = droppedStrip(prevRows, rows, data, true);

    drawTrend();
    drawPareto();
    renderMinervini(q(".mv-cards"), q(".mv-count"), rows, data);
    renderSummary(q(".market-summary"), data, state.date);
  }

  q(".date-pick").addEventListener("change", (e) => {
    state.date = e.target.value;
    state.sector = null;
    draw();
  });
  draw();
}

async function loadAlignment(containerId, url, label) {
  const app = document.getElementById(containerId);
  try {
    const data = await fetch(url, { cache: "no-store" }).then((r) => r.json());
    renderAlignment(app, data, label);
    return data.generated_at;
  } catch (err) {
    console.error(err);
    app.innerHTML = `<div class="error">데이터를 불러오지 못했습니다: ${err.message}</div>`;
    return null;
  }
}

function setupTabs() {
  const buttons = document.querySelectorAll(".tabs button");
  buttons.forEach((btn) => {
    btn.addEventListener("click", () => {
      buttons.forEach((b) => b.classList.toggle("active", b === btn));
      document.querySelectorAll(".tab-panel").forEach((p) => {
        p.classList.toggle("active", p.id === `app-${btn.dataset.tab}`);
      });
    });
  });
}

async function main() {
  setupTabs();
  const [krUpdatedAt, usUpdatedAt, kospiUpdatedAt, kosdaqUpdatedAt] = await Promise.all([
    loadMarket("app-kr", "data/groups.json", "data/prices.json", "원"),
    loadMarket("app-us", "data/us_groups.json", "data/us_prices.json", "$"),
    loadAlignment("app-kospi", "data/kospi200_signals.json", "코스피200"),
    loadAlignment("app-kosdaq", "data/kosdaq150_signals.json", "코스닥150"),
  ]);
  const parts = [];
  if (krUpdatedAt) parts.push("국내 " + new Date(krUpdatedAt).toLocaleString("ko-KR"));
  if (usUpdatedAt) parts.push("미국 " + new Date(usUpdatedAt).toLocaleString("ko-KR"));
  if (kospiUpdatedAt) parts.push("코스피200 " + new Date(kospiUpdatedAt).toLocaleString("ko-KR"));
  if (kosdaqUpdatedAt) parts.push("코스닥150 " + new Date(kosdaqUpdatedAt).toLocaleString("ko-KR"));
  document.getElementById("updated-at").textContent = parts.length
    ? "마지막 업데이트 — " + parts.join(" / ")
    : "업데이트 시각을 불러오지 못했습니다.";
}

main();
</script>
